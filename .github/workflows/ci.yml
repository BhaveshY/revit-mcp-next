name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  broker:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Catalog gates and spec parity
        run: npm run gen:catalog -- --check
      - name: E2E surface (S00, no Revit)
        run: node e2e/run.mjs --profile surface
      - name: Upload e2e summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-surface
          path: artifacts/e2e/
          if-no-files-found: ignore
